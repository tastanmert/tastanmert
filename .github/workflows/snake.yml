name: Refresh contribution snake

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Draw contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=%23c67b4e&color_dots=%23ebedf0,%23f2d9c7,%23e6b38e,%23cf8d61,%23a55e35
            assets/snake-dark.svg?palette=github-dark&color_snake=%23eaa475&color_dots=%2321262d,%234d382c,%23784f36,%23b3764c,%23eaa475
      - name: Save generated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake-light.svg assets/snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution snake'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
